<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room – CyberLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#070b14;--panel:#0e1627;--border:#1c2a44;--text:#e6edf8;--muted:#8393ad;--cyan:#22d3ee;--violet:#7c5cff;--green:#34d399;--red:#fb7185;--grad:linear-gradient(90deg,var(--cyan),var(--violet))}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:760px;margin:0 auto;padding:0 28px}
    .mono{font-family:'JetBrains Mono',monospace}

    header{position:sticky;top:0;z-index:50;background:rgba(7,11,20,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
    .nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:20px}
    .logo{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px}
    .logo-mark{width:30px;height:30px;border-radius:8px;background:var(--grad);display:grid;place-items:center;flex-shrink:0}
    .logo span{color:var(--cyan)}
    .back{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-right:auto}
    .pts{font:600 13px 'JetBrains Mono',monospace;color:var(--cyan)}

    main{padding:48px 0 90px}
    h1{font-size:32px;font-weight:800;letter-spacing:-.7px;margin-bottom:30px}

    #lessonBox{margin-bottom:36px;padding:28px 30px;background:var(--panel);border:1px solid var(--border);border-radius:14px;line-height:1.75;font-size:15px;color:#c3cee0}
    #lessonBox h3{color:var(--text);font-size:16.5px;margin:22px 0 10px}
    #lessonBox h3:first-child{margin-top:0}
    #lessonBox p{margin-bottom:14px}
    #lessonBox ul{margin:0 0 14px 20px}
    #lessonBox li{margin-bottom:6px}
    #lessonBox code{background:#16213a;padding:2px 7px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:13.5px;color:var(--cyan)}
    #lessonBox strong{color:var(--text)}

    .task{padding:26px;background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:20px;transition:.2s}
    .task.done{border-color:var(--green)}
    .task-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .task-title{font:700 13px 'JetBrains Mono',monospace;color:var(--cyan)}
    .task.done .task-title{color:var(--green)}
    .badge-done{font:600 11.5px 'JetBrains Mono',monospace;color:var(--green);display:none}
    .task.done .badge-done{display:inline}
    .question{font-size:15.5px;margin-bottom:18px;line-height:1.6}

    .answer-row{display:flex;gap:10px}
    input[type=text]{flex:1;padding:12px 14px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14.5px;font-family:inherit}
    input[type=text]:focus{outline:none;border-color:var(--cyan)}
    button{padding:12px 20px;border:0;border-radius:8px;background:var(--grad);color:#04121c;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
    button:disabled{opacity:.5;cursor:default}

    .options{display:grid;gap:10px}
    .opt{padding:12px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:14.5px;transition:.15s}
    .opt:hover{border-color:var(--cyan)}
    .opt.selected{border-color:var(--cyan);background:rgba(34,211,238,.06)}

    .fb{margin-top:12px;font:600 13px 'JetBrains Mono',monospace;min-height:18px}
    .fb.ok{color:var(--green)} .fb.err{color:var(--red)}

    .loading, .error-box{text-align:center;color:var(--muted);padding:60px 0}

    #progressWrap{margin-bottom:30px}
    #progressWrap .row{display:flex;justify-content:space-between;font:600 13px 'JetBrains Mono',monospace;color:var(--muted);margin-bottom:8px}
    #progressWrap .bar{height:8px;border-radius:8px;background:#16213a;overflow:hidden}
    #progressWrap .bar i{display:block;height:100%;width:0%;background:var(--grad);transition:width .3s}

    #completeBox{margin-top:30px;text-align:center;padding:40px;background:linear-gradient(180deg,var(--panel),#0b1220);border:1px solid var(--green);border-radius:16px}
    #completeBox .emoji{font-size:40px;margin-bottom:12px}
    #completeBox h2{font-size:24px;margin-bottom:8px}
    #completeBox p{color:var(--muted);font-size:14.5px;margin-bottom:24px}
    #completeBox a{display:inline-block;padding:13px 28px;border-radius:9px;background:var(--grad);color:#04121c;font-weight:700}
  </style>
</head>
<body>

  <header>
    <div class="wrap nav">
      <a href="/dashboard.html" class="logo">
        <div class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5.5V11c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5.5L12 2z" stroke="#04121c" stroke-width="2" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#04121c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        cyber<span>lab</span>
      </a>
      <a href="/dashboard.html" class="back">← Dashboard</a>
      <span class="pts" id="totalPoints"></span>
    </div>
  </header>

  <main class="wrap">
    <div id="progressWrap" style="display:none">
      <div class="row">
        <span id="progressText">0/0 tasks completed</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="bar"><div id="progressBar"></div></div>
    </div>

    <div id="lessonBox" style="display:none"></div>

    <div id="content" class="loading">Loading room...</div>

    <div id="completeBox" style="display:none">
      <div class="emoji">🏆</div>
      <h2>Room completed!</h2>
      <p>Great work. You've finished every task in this room.</p>
      <a href="/labs.html">Back to Labs →</a>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const roomId = params.get('id');
    const content = document.getElementById('content');

    if (!roomId) {
      content.className = 'error-box';
      content.textContent = 'No room specified.';
    } else {
      loadRoom();
    }

    async function loadRoom() {
      const meRes = await fetch('/me', { credentials: 'include' });
      const me = await meRes.json();
      if (!me.loggedIn) { window.location.href = '/login.html'; return; }
      document.getElementById('totalPoints').textContent = me.points + ' pts';

      const res = await fetch('/api/rooms/' + encodeURIComponent(roomId), { credentials: 'include' });
      if (!res.ok) {
        content.className = 'error-box';
        content.textContent = 'Room not found.';
        return;
      }
      const room = await res.json();
      render(room);
    }

    function render(room) {
      content.className = '';
      content.innerHTML = '';

      updateProgress(room);

      if (room.lesson) {
        document.getElementById('lessonBox').style.display = 'block';
        document.getElementById('lessonBox').innerHTML = room.lesson;
      }

      const h1 = document.createElement('h1');
      h1.textContent = room.title;
      content.appendChild(h1);

      room.tasks.forEach((task, i) => {
        const done = room.doneTasks.includes(task.id);
        const box = document.createElement('div');
        box.className = 'task' + (done ? ' done' : '');
        box.id = 'task-' + task.id;

        box.innerHTML = `
          <div class="task-head">
            <span class="task-title">Task ${i + 1} · ${task.points} pts</span>
            <span class="badge-done">✔ done</span>
          </div>
          <p class="question">${task.question}</p>
        `;

        if (task.type === 'text') {
          const row = document.createElement('div');
          row.className = 'answer-row';
          row.innerHTML = `
            <input type="text" placeholder="Your answer" ${done ? 'disabled' : ''}>
            <button ${done ? 'disabled' : ''}>Submit</button>
          `;
          const input = row.querySelector('input');
          const btn = row.querySelector('button');
          const fb = document.createElement('p');
          fb.className = 'fb';

          const submit = () => submitAnswer(task.id, input.value, btn, fb, box, input);
          btn.addEventListener('click', submit);
          input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

          box.appendChild(row);
          box.appendChild(fb);
        }

        if (task.type === 'mcq') {
          const opts = document.createElement('div');
          opts.className = 'options';
          let selected = null;

          task.options.forEach((opt, idx) => {
            const el = document.createElement('div');
            el.className = 'opt';
            el.textContent = opt;
            if (!done) {
              el.addEventListener('click', () => {
                opts.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
                el.classList.add('selected');
                selected = idx;
              });
            }
            opts.appendChild(el);
          });

          const btn = document.createElement('button');
          btn.textContent = 'Submit';
          btn.style.marginTop = '14px';
          btn.disabled = done;
          const fb = document.createElement('p');
          fb.className = 'fb';

          btn.addEventListener('click', () => {
            if (selected === null) { fb.textContent = 'Pick an option first.'; fb.className = 'fb err'; return; }
            submitAnswer(task.id, selected, btn, fb, box, null);
          });

          box.appendChild(opts);
          box.appendChild(btn);
          box.appendChild(fb);
        }

        content.appendChild(box);
      });
    }

    async function submitAnswer(taskId, answer, btn, fb, box, input) {
      btn.disabled = true;
      fb.textContent = '';
      fb.className = 'fb';

      try {
        const res = await fetch(`/api/rooms/${encodeURIComponent(roomId)}/${encodeURIComponent(taskId)}`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answer })
        });
        const data = await res.json();

        if (data.correct) {
          fb.textContent = data.alreadyDone ? 'Correct! (already completed)' : `Correct! +${data.points} points`;
          fb.className = 'fb ok';
          box.classList.add('done');
          if (input) input.disabled = true;
          if (!data.alreadyDone) {
            const totalEl = document.getElementById('totalPoints');
            const current = parseInt(totalEl.textContent) || 0;
            totalEl.textContent = (current + data.points) + ' pts';

            const doneCount = document.querySelectorAll('.task.done').length;
            const totalCount = document.querySelectorAll('.task').length;
            const pct = Math.round((doneCount / totalCount) * 100);
            document.getElementById('progressText').textContent = `${doneCount}/${totalCount} tasks completed`;
            document.getElementById('progressPct').textContent = pct + '%';
            document.getElementById('progressBar').style.width = pct + '%';
            if (doneCount === totalCount) {
              document.getElementById('completeBox').style.display = 'block';
              document.getElementById('completeBox').scrollIntoView({ behavior: 'smooth' });
            }
          }
        } else {
          fb.textContent = data.message || 'Not quite. Try again!';
          fb.className = 'fb err';
          btn.disabled = false;
        }
      } catch (err) {
        fb.textContent = 'Cannot reach the server.';
        fb.className = 'fb err';
        btn.disabled = false;
      }
    }

    function updateProgress(room) {
      const total = room.tasks.length;
      const done = room.doneTasks.length;
      const pct = total ? Math.round((done / total) * 100) : 0;

      document.getElementById('progressWrap').style.display = 'block';
      document.getElementById('progressText').textContent = `${done}/${total} tasks completed`;
      document.getElementById('progressPct').textContent = pct + '%';
      document.getElementById('progressBar').style.width = pct + '%';

      if (done === total && total > 0) {
        document.getElementById('completeBox').style.display = 'block';
      }
    }
  </script>
</body>
</html>
